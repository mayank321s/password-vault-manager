name: Release Readiness

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Validation Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend unit tests
        run: pnpm --filter backend run test -- --runInBand --passWithNoTests

      - name: Extension package tests
        run: pnpm --filter @repo/extension-core run test

      - name: Backend build
        run: pnpm --filter backend build

      - name: Frontend typecheck
        run: pnpm --filter frontend run check-types

      - name: Frontend build
        run: pnpm --filter frontend build

  migration-smoke:
    name: Migration Smoke Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: password_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d password_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: password_manager
      DATABASE_SSL: false
      DATABASE_LOGGING: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter backend run migrate:up

      - name: Verify no pending migrations remain
        run: pnpm --filter backend run migrate:check

  probe-smoke:
    name: Health Probe Smoke Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: password_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d password_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: password_manager
      DATABASE_SSL: false
      DATABASE_LOGGING: false
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: test-jwt-secret-with-sufficient-length-for-ci
      JWT_REFRESH_SECRET: test-refresh-secret-with-sufficient-length-for-ci
      JWT_EXPIRATION: 1h
      JWT_REFRESH_EXPIRATION: 7d
      ARGON2_SERVER_SALT: test-argon-salt-with-sufficient-length-for-ci
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter backend run migrate:up

      - name: Build backend
        run: pnpm --filter backend build

      - name: Start backend
        run: pnpm --filter backend run start:prod &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3001/api/v1/health/live > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time."
          exit 1

      - name: Probe liveness
        run: curl --fail http://127.0.0.1:3001/api/v1/health/live

      - name: Probe readiness
        run: curl --fail http://127.0.0.1:3001/api/v1/health/ready
